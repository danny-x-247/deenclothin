
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Product management dashboard">

    <title>Product Admin</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <h2>Store Admin</h2>

        <a href="#products" class="active">Products</a>

        <a href="file:///c%3A/deen-client-folder/index.html">View Website</a>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- HEADER -->
        <div class="header">

            <div>
                <h1>Products</h1>
                <p>Manage your store products and new arrivals.</p>
            </div>

            <div class="admin-user">
                Admin
            </div>

        </div>


        <!-- ADD PRODUCT -->
        <section class="products-section">

            <div class="header">

                <h2>Add New Product</h2>

            </div>

            <form id="productForm">

                <input
                    type="text"
                    id="productName"
                    placeholder="Product name"
                    required
                >

                <input
                    type="text"
                    id="productCategory"
                    placeholder="Category"
                    required
                >

                <input
                    type="number"
                    id="productPrice"
                    placeholder="Price"
                    required
                >

                <input
                    type="text"
                    id="productImage"
                    placeholder="Image path e.g. assets/image1.jpeg"
                    required
                >

                <input
                    type="text"
                    id="productBadge"
                    placeholder="Badge (optional) e.g. New"
                >

                <button type="submit" class="btn btn-add">
                    Add Product
                </button>

            </form>

        </section>


        <!-- PRODUCT LIST -->
        <section class="products-section" id="products">

            <div class="header">

                <h2>Current Products</h2>

            </div>


            <table class="product-table">

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Product</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Actions</th>
                    </tr>

                </thead>


                <tbody id="productList">

                    <!-- Products will appear here -->

                </tbody>

            </table>

        </section>

    </main>


    <script src="admin.js"></script>

</body>
</html>
